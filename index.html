<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f131a">
<title>Elite Redux 한글 도감 · STAGE 9</title>

<body>
<header class="top">
  <div class="brand"><b>ER</b><div><strong>Elite Redux 한글 도감</strong><small>CLEAN REBUILD · STAGE 9</small></div></div>
  <label class="search"><span>⌕</span><input id="q" type="search" placeholder="포켓몬 이름 또는 도감 번호를 검색해주세요" autocomplete="off"></label>
</header>
<main>
  <section class="hero">
    <div><small>ELITE REDUX 2.65.3b</small><h1>포켓몬 도감</h1><p>공식 NextDex v2.65beta 데이터를 기준으로 포켓몬·폼·타입·종족값을 한글 목록에서 확인합니다.</p></div>
    <div class="status"><b id="count">0</b><span id="countLabel">불러온 포켓몬·폼</span></div>
  </section>
  <section class="notice">STAGE 9 TEST: 카드 최상단에 도감 번호와 한국어/영문 이름을 전체 폭으로 배치해 긴 이름도 최대한 잘리지 않도록 개선했습니다.</section>
  <nav class="tabs" aria-label="도감 분류">
    <button class="tab active" data-view="pokemon">포켓몬</button>
    <button class="tab" data-view="moves">기술</button>
    <button class="tab" data-view="abilities">특성</button>
  </nav>
  <section id="pokemonFilters" class="dex-controls" aria-label="포켓몬 필터">
    <div class="filter-top"><strong>타입 필터</strong><button id="resetFilters" class="filter-reset" type="button">초기화</button></div>
    <div id="typeFilters" class="type-filters"></div>
    <div class="list-tools">
      <label class="sort-control">정렬
        <select id="sortPokemon">
          <option value="dex">도감 번호순</option>
          <option value="name">이름순</option>
          <option value="bst">종족값 합계순</option>
        </select>
      </label>
      <label class="form-toggle"><input id="showForms" type="checkbox" checked> 폼 포함</label>
    </div>
  </section>
  <div class="head"><h2 id="title">포켓몬 도감</h2><span id="result"></span></div>
  <div id="grid" class="grid pokemon-grid"></div>
  <div id="empty" class="empty" hidden>검색 결과가 없습니다.</div>
</main>
<div id="detailBackdrop" class="detail-backdrop" hidden>
  <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="detail-top"><div><div id="detailType" class="detail-type"></div><h2 id="detailTitle" class="detail-title"></h2></div><button id="detailClose" class="detail-close" type="button" aria-label="상세 보기 닫기">×</button></div>
    <div class="detail-body">
      <section id="detailPokemonExtra" class="detail-section" hidden></section>
      <section class="detail-section"><h3 id="detailShortLabel">요약 설명</h3><p id="detailShort" class="detail-text"></p></section>
      <section class="detail-section"><h3 id="detailLongLabel">상세 설명</h3><p id="detailLong" class="detail-text"></p></section>
      <section id="detailFormsSection" class="detail-section" hidden><h3>같은 도감 번호의 폼</h3><div id="detailForms" class="form-grid"></div></section>
    </div>
  </section>
</div>
