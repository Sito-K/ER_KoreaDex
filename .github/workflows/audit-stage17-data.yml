# STAGE35 QUARANTINED: old workflow retained for history, no automatic execution and jobs cannot run.
name: Audit Stage 17 Pokemon data

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    if: ${{ false }} # STAGE35: disabled until reviewed for v1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Stage 17 full data audit
        run: node stage17-data-audit.js
      - name: Commit audit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage17-data-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Stage 17 Pokemon data audit"
          git pull --rebase origin main
          git push origin HEAD:main
