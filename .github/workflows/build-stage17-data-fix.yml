# STAGE35 QUARANTINED: old workflow retained for history, no automatic execution and jobs cannot run.
name: Build Stage 17 Pokemon data fix

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    if: ${{ false }} # STAGE35: disabled until reviewed for v1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Stage 17 Mega category fix
        run: node stage17-fix.js
      - name: Re-run Stage 17 official data audit
        run: node stage17-data-audit.js
      - name: Commit Stage 17 data and audits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add forms.js pokemon-data.js stage17-fix-audit.json stage17-data-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Stage 17 Pokemon data fix"
          git pull --rebase origin main
          git push origin HEAD:main
