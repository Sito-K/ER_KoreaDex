name: Build Stage 17 Pokemon data fix

on:
  push:
    branches: [main]
    paths:
      - 'stage17-fix.js'
      - '.github/workflows/build-stage17-data-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Stage 17 Mega category fix
        run: node stage17-fix.js
      - name: Re-run Stage 17 official data audit
        run: node stage17-data-audit.js
      - name: Commit Stage 17 data and audits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add forms.js pokemon-data.js stage17-fix-audit.json stage17-data-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Stage 17 Pokemon data fix"
          git pull --rebase origin main
          git push origin HEAD:main
