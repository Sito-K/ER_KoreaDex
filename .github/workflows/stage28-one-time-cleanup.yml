name: STAGE28 one-time safe branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage28-one-time-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove merged obsolete branches only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branches=(
            "stage4-short-descriptions-work"
            "stage4-short-descriptions-work-2"
            "stage4-short-descriptions-work-3"
            "stage6-static-forms-build"
            "tmp5"
            "tmp6"
            "tmp-do-not-use"
            "tmp-ignore"
            "tmp-name-verify"
            "tmp-name-verify2"
          )
          for branch in "${branches[@]}"; do
            echo "Evaluating branch: $branch"
            meta=$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch")
            if [[ "$(jq -r '.protected' <<<"$meta")" != "false" ]]; then
              echo "SKIP protected branch $branch"
              continue
            fi
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...main")
            if [[ "$(jq -r '.behind_by' <<<"$relation")" != "0" ]]; then
              echo "SKIP branch with unique commits $branch"
              continue
            fi
            refs=$(grep -RFl --include='*.yml' --include='*.yaml' -- "$branch" .github/workflows | grep -v 'stage28-one-time-cleanup.yml' || true)
            if [[ -n "$refs" ]]; then
              echo "SKIP workflow-referenced branch: $branch ($refs)"
              continue
            fi
            echo "DELETING fully merged obsolete branch $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          done
          echo "STAGE28 safe cleanup finished"
