name: Build Stage 19 species abilities and learnsets
on:
  push:
    paths:
      - 'stage19-build.js'
      - '.github/workflows/build-stage19.yml'
      - 'moves-1.js'
      - 'moves-2.js'
      - 'moves-3.js'
      - 'abilities-1.js'
      - 'abilities-2.js'
      - 'abilities-3.js'
      - 'ability-stage18.js'
      - 'pokemon-data.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Stage 19 species relationship data
        run: node stage19-build.js
      - name: Commit Stage 19 generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage19-data.js stage19-audit.json
          git diff --cached --quiet || git commit -m "Generate Stage 19 species ability and learnset data"
          git push
