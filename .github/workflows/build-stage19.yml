# STAGE35 QUARANTINED: old workflow retained for history, no automatic execution and jobs cannot run.
name: Build Stage 19 species abilities and learnsets
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    if: ${{ false }} # STAGE35: disabled until reviewed for v1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Stage 19 species relationship data
        run: node stage19-build.js
      - name: Commit Stage 19 generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage19-data.js stage19-audit.json
          git diff --cached --quiet || git commit -m "Generate Stage 19 species ability and learnset data"
          git push
