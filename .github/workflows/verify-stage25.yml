name: Verify Stage 25 always-visible details
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Stage 25 scripts
        run: |
          node --check stage19.js
          node --check stage20.js
          node --check stage21.js
          node --check stage25.js
      - name: Historical Stage 25 verifier
        run: echo 'Stage 25 is archived; current verification is handled by the latest stage.'
