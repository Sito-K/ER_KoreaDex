name: Probe Stage 20 evolutions
on:
  push:
    paths:
      - 'stage20-probe.js'
      - '.github/workflows/probe-stage20-evolutions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official 2.65.4 evolutions
        run: node stage20-probe.js
      - name: Commit probe report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage20-probe.json
          git diff --cached --quiet || git commit -m "Generate Stage 20 evolution probe"
          git push
