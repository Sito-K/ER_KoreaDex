# STAGE35 QUARANTINED: old workflow retained for history, no automatic execution and jobs cannot run.
name: Build Stage 14 strict NextDex 2.65.4 data

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    if: ${{ false }} # STAGE35: disabled until reviewed for v1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate latest 2.65.4 data
        run: node stage14-build.js
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pokemon-data.js forms.js stage14-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Stage 14 strict 2.65.4 data"
          git pull --rebase origin main
          git push origin HEAD:main
