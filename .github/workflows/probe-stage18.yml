name: Probe Stage 18 NextDex data
on:
  push:
    paths:
      - 'stage18-probe.js'
      - '.github/workflows/probe-stage18.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official NextDex structure
        run: node stage18-probe.js
      - name: Commit probe result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage18-probe.json
          git diff --cached --quiet || git commit -m "Generate Stage 18 data probe"
          git push
