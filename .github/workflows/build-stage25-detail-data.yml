# STAGE35 QUARANTINED: old workflow retained for history, no automatic execution and jobs cannot run.
name: Build Stage 25 detail data
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    if: ${{ false }} # STAGE35: disabled until reviewed for v1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Stage 25 detail data
        run: node stage25-build.js
      - name: Commit generated detail data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage25-detail-data.js stage25-detail-audit.json
          git diff --cached --quiet || git commit -m "Build Stage 25 Korean detail data"
          git push
