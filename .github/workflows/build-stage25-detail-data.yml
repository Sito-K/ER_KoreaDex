name: Build Stage 25 detail data
on:
  push:
    paths:
      - 'stage25-build.js'
      - 'moves-*.js'
      - 'move-short-*.js'
      - 'move-long-*.js'
      - 'abilities-*.js'
      - 'ability-stage18.js'
      - 'ability-short-*.js'
      - 'ability-long-*.js'
      - '.github/workflows/build-stage25-detail-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Stage 25 detail data
        run: node stage25-build.js
      - name: Commit generated detail data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage25-detail-data.js stage25-detail-audit.json
          git diff --cached --quiet || git commit -m "Build Stage 25 Korean detail data"
          git push
