name: STAGE36 Temporary Branch Pruning
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage36-once-prune.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup, repository, and deployed v1.1 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Sito-K/ER_KoreaDex"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/backup-v1-before-v11-stage36-20261103" --jq '.commit.sha')" = "09d809d3749378a065cf871e86601ca656d92868"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/preview-8OX-d8Ma4OEhlIiSX7dc2OpX/index.html?ref=main" --jq '.sha')" = "b7e2d1843dc7ac664a610bd189252fe7087d2175"
      - name: Delete exact outdated preview branches, no other branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for entry in "stage23-preview-built-20261102:2524d0d4f9e31f00c26b1ebef2446e8ae35a4063" "stage23-preview-source-20261102:d2099bfbe2ec946ffd8e29e27c5ab50ec50c640d"; do
            branch="${entry%%:*}"
            sha="${entry#*:}"
            test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.commit.sha')" = "$sha"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch"
          done
