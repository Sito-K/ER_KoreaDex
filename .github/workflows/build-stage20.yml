name: Build Stage 20 evolutions
on:
  push:
    paths:
      - 'stage20-build.js'
      - '.github/workflows/build-stage20.yml'
      - 'moves-1.js'
      - 'moves-2.js'
      - 'moves-3.js'
      - 'pokemon-data.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Stage 20 evolution data
        run: node stage20-build.js
      - name: Commit Stage 20 generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage20-data.js stage20-audit.json
          git diff --cached --quiet || git commit -m "Generate Stage 20 evolution data"
          git push
