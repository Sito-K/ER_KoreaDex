name: Build Stage 22 Korean maps
on:
  push:
    paths:
      - 'stage22-build.js'
      - 'stage22-map-names.json'
      - '.github/workflows/build-stage22-map-ko.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Korean map names
        run: node stage22-build.js
      - name: Commit generated map data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage22-map-ko.js stage22-map-audit.json
          git diff --cached --quiet || git commit -m "Generate Stage 22 Korean map names"
          git push
