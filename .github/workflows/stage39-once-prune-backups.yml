name: STAGE39 Temporary Obsolete Backup Branch Cleanup
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage39-once-prune-backups.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify preserved rollback branch and exact obsolete refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Sito-K/ER_KoreaDex"
          test "$GITHUB_REF" = "refs/heads/main"
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/branches/backup-v1-immediate-before-v11-release-20261103" --jq '.commit.sha')" = "916513a850d9dc0573d6fee847b494f545ea7d4b"
          test "$(gh api "repos/$repo/contents/index.html?ref=main" --jq '.sha')" = "05a772eab7345dc6c766d130f5da15dd11062a87"
          test "$(gh api "repos/$repo/branches/backup-pre-clean-rebuild-20261009" --jq '.commit.sha')" = "82893bad6416e205b1f7206b0a802631687a9b8d"
          test "$(gh api "repos/$repo/branches/backup-v1-before-v11-stage36-20261103" --jq '.commit.sha')" = "09d809d3749378a065cf871e86601ca656d92868"
      - name: Delete only the two fully merged superseded backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api -X DELETE "repos/$repo/git/refs/heads/backup-pre-clean-rebuild-20261009"
          gh api -X DELETE "repos/$repo/git/refs/heads/backup-v1-before-v11-stage36-20261103"
          echo 'Retained main and backup-v1-immediate-before-v11-release-20261103'
