name: Probe Stage 22 map names
on:
  push:
    paths:
      - 'stage22-probe-maps.js'
      - '.github/workflows/probe-stage22-maps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe map names
        run: node stage22-probe-maps.js
      - name: Commit map list
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage22-map-names.json
          git diff --cached --quiet || git commit -m "Generate Stage 22 map name list"
          git push
