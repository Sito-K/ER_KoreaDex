# STAGE21 private release candidate: verification only, never publish or push.
name: Verify native Korean Dex (read-only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-dex-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed sprite verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: STAGE22 deploy-safety preflight (read-only, no release)
        run: python tools/stage22/verify_preflight.py . --report stage22-preflight.json
      - name: STAGE21 release gate (local scripts, sprites, dataset relations)
        run: python tools/stage21/verify_release.py . --report stage21-release-gate.json
      - name: Korean source provenance and description fallback
        run: node tools/stage11/verify_source_gaps.js .
      - name: Existing native-catalog DOM/mock network regression
        run: |
          node tools/stage10/simulate_dom_callbacks.js .
          node tools/stage10/simulate_detail_modules.js .
          node tools/stage10/simulate_stage9_network.js .
      - name: STAGE16-20 current DOM, async and accessibility regressions
        run: |
          node tools/stage21/stage16_dom_smoke.js .
          node tools/stage21/stage17_dom_smoke.js .
          node tools/stage21/stage18_dom_smoke.js .
          node tools/stage21/stage19_async_vm.js .
          node tools/stage21/stage19_catalog_vm.js .
          node tools/stage21/stage20_accessibility_vm.js .
          node tools/stage21/stage20_reference_race_vm.js .
      - name: STAGE23 local preview HTTP/static compatibility gate (read-only)
        run: python tools/stage23/verify_preview.py . --report stage23-local-report.json
      - name: JavaScript syntax gate
        run: find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Store release gate output (private, no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: private-dex-stage22-release-preflight
          path: |
            stage21-release-gate.json
            stage22-preflight.json
            stage23-local-report.json
          retention-days: 7
